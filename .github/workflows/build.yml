# Builds opengl32.dll from source on every push. Pushing a tag like v0.1.0 also publishes a
# GitHub release with a ready-to-use zip for Windows (and Wine) players.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686
      - name: Build
        run: sh build.sh
      - name: Package
        run: |
          mkdir -p dist/sswrap
          cp opengl32.dll sswrap.ini LICENSE dist/sswrap/
          cp INSTALL-WINDOWS.txt dist/sswrap/
          (cd dist/sswrap && sha256sum opengl32.dll > SHA256SUMS.txt)
          (cd dist && zip -r -9 "sswrap-${GITHUB_REF_NAME//\//-}.zip" sswrap)
      - uses: actions/upload-artifact@v4
        with:
          name: sswrap
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
