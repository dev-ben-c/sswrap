; sswrap: Starsiege OpenGL wrapper settings. Read once at game start.
[sswrap]
; 1 = virtual display + off-screen rendering + scaling to the monitor.
; 0 = pure pass-through (logging and the stall watchdog still work), for A/B testing.
Enabled=1
; Off-screen render size = the resolution the game asked for times this (fractions allowed, e.g.
; 1.5). The startup window sets it from "Render quality": 2 at a native 2560x1440 renders the
; 3D world at 5120x2880 and downsamples it (supersampling).
; Anything above 1 is experimental (see sswrap.log for WARNING lines).
RenderScale=1
; 0 = errors and stalls only, 1 = normal, 2 = verbose (GL errors, every mode/window call), 3 = everything
LogLevel=1
; A gap between frames longer than this (ms) is logged as SLOW FRAME, and the watchdog
; samples where the game's render thread is stuck. 0 disables the watchdog.
StallMs=200
; 1 = smooth (bilinear) scaling, 0 = sharp (nearest neighbour)
LinearFilter=1
; Print an fps / worst-frame summary every N seconds (0 = off)
StatsSeconds=10
; Hostnames (suffix match, comma separated) whose DNS lookups fail instantly instead of
; blocking the game for ~2 s each. The Dynamix master/IRC servers have been gone since ~2000.
BlockHosts=dynamix.com

; ---- visual effects (each can be switched off on its own) ----
; Ambient occlusion: soft contact shadows in corners, under Hercs, where buildings meet the
; ground. Applied before the HUD is drawn, so the HUD stays clean.
AO=1
; Shadow reach in game units, darkness, and the distance beyond which AO fades out.
AORadius=3.0
AOStrength=1.5
AOMaxDistance=400
; Edge smoothing (FXAA) and contrast-adaptive sharpening (0 = off, 0.2-0.8 typical).
; Both apply to the 3D world only (before the HUD), so menus, HUD and text stay untouched.
FXAA=1
Sharpen=0.4

; ---- resolutions ----
; The game's resolution menu lists common 4:3, 16:9, 16:10 and ultrawide sizes plus your
; monitor's native size. Add more here, e.g. ExtraModes=1720x720,2880x1200
ExtraModes=

; ---- how the game draws (needed for the effects) ----
; Starsiege projects its 3D world on the CPU, so the effects run when it switches depth testing
; off for the HUD after drawing at least MinWorldDraws world objects. Ambient occlusion rebuilds
; positions from the depth buffer using this horizontal field of view (degrees) and
; distance = DepthScale / depth.
FOV=90
DepthScale=1.0
MinWorldDraws=50

; ---- textures ----
; TextureDump=1 saves every texture the game loads to sswrap_textures\dump\ as TGA (once each).
; TextureReplace=1 loads a file with the same name (PNG, TGA or JPG, any size) from
; sswrap_textures\load\ instead, e.g. an AI-upscaled texture pack.
TextureDump=0
TextureReplace=1

; ---- startup ----
; 1 = show the display settings window (resolution, HUD scale, render quality, effects) at every launch.
AskOnLaunch=1
; 1 = keep the HUD within a centred 16:9 area on wider screens (rewrites hudLayout.prf;
;     the original is kept as hudLayout.prf.sswrap-orig). Set from the startup window.
UltrawideHud=0

; ---- HUD scale (Starsiege 1.004 only) ----
; Enlarges the HUD meters (radar, shields, weapons, reticle, ...) at any game resolution, each
; growing from the screen edge or corner it sits at. 1 = off. Set from the startup window.
HudScale=1

; ---- UI / HUD art upscaling ----
; Enlarges the HUD, menu and font bitmaps the game assembles at runtime, 2 or 4 times (1 = off):
; each bitmap gets an HD replacement from sswrap_textures/load/ (sub_*.png) if there is one,
; otherwise the Scale2x pixel-art filter. Pairs with HudScale for a sharper, bigger HUD.
UiUpscale=1
